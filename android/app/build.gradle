plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase google-services: применяем в конце файла после android {}
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Release-подпись: пароли и путь к keystore лежат в android/key.properties
// (вне git). Если файл отсутствует — release-сборка откатывается на debug
// подпись, чтобы flutter run --release работал локально без keystore.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.b2blogist.smarttracker"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        // Собственный release-keystore для публикации в Google Play.
        // Параметры берутся из android/key.properties (вне git).
        // Файл создаётся один раз: см. GOOGLE_PLAY_AUDIT.md.
        release {
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
            storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword = keystoreProperties["storePassword"]
        }
    }

    defaultConfig {
        applicationId = "com.b2blogist.smarttracker"
        // minSdk 23 требуется для firebase_messaging
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // По умолчанию release-варианты используют debug-ключ.
            // Для prodRelease ниже задаётся production-keystore.
            signingConfig = signingConfigs.debug
        }
    }

    flavorDimensions += "env"

    productFlavors {
        prod {
            dimension = "env"
        }
        dev {
            dimension = "env"
            applicationId = "com.b2blogist.smarttracker.develop"
            resValue "string", "app_name", "Умный Водитель Dev"
        }
    }
}

// Подпись задаётся на уровне variant, чтобы devRelease не унаследовал
// production-ключ только из-за общего release build type.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.name == "prodRelease" && keystorePropertiesFile.exists()) {
            variant.signingConfig.setConfig(android.signingConfigs.getByName("release"))
        }
    }
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}

flutter {
    source = "../.."
}

// google-services: читать google-services.json (android/app/google-services.json)
apply plugin: "com.google.gms.google-services"
