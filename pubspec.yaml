name: smarttracker
description: "Умный Водитель — рабочий инструмент водителя логистической платформы «Умная логистика»."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Сетевой слой
  dio: ^5.10.0

  # Безопасное хранилище (токен сессии)
  flutter_secure_storage: ^10.3.1

  # Dependency Injection
  get_it: ^9.2.1

  # Навигация
  go_router: ^17.3.0

  # Модели (freezed)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Изображения (выбор/съёмка фото)
  image_picker: ^1.2.0

  # Файловая система (копирование фото в ApplicationDocuments)
  path_provider: ^2.1.5
  path: ^1.9.0

  # Локальная БД (офлайн-очередь pending_actions)
  sqflite: ^2.4.1

  # Геолокация + фоновый foreground-сервис
  geolocator: ^14.0.3
  flutter_foreground_task: ^10.0.0

  # Запрос разрешений (геолокация, камера и т.д.)
  permission_handler: ^12.0.3

  # Фоновая синхронизация
  workmanager: ^0.9.0+3

  # Push-уведомления
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.0.1

  # Звонок по номеру из приложения
  url_launcher: ^6.3.2

  # Кэшированные сетевые изображения (аватары, фото)
  cached_network_image: ^3.4.1

  # Локальные настройки (переключатель push)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Платформенные интерфейсы для моков в тестах
  permission_handler_platform_interface: ^4.2.3
  plugin_platform_interface: ^2.1.8

  # Генерация кода
  build_runner: ^2.15.1
  freezed: ^3.0.6
  json_serializable: ^6.9.5

  # Иконки приложения
  flutter_launcher_icons: ^0.14.4

  # Тестирование SQLite с in-memory базой.
  sqflite_common_ffi: '>=2.3.3 <2.4.0'

# Конфигурация иконок приложения (Android + iOS).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icons/ic_launcher.png"
  # Адаптивная иконка Android: фирменный знак на оранжевом фоне.
  adaptive_icon_background: "#FE4500"
  adaptive_icon_foreground: "icons/ic_launcher_foreground.png"
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/cities/

  # Брендовые шрифты (bundled, OFL — лицензии рядом в assets/fonts).
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
