name: smarttracker
description: "Умный Водитель — рабочий инструмент водителя логистической платформы «Умная логистика»."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Сетевой слой
  dio: ^5.4.0

  # Безопасное хранилище (токен сессии)
  flutter_secure_storage: ^9.2.0

  # Dependency Injection
  get_it: ^7.7.0

  # Навигация
  go_router: ^14.2.0

  # Брендовые шрифты
  google_fonts: ^6.2.0

  # Модели (freezed)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Изображения (выбор/съёмка фото)
  image_picker: ^1.1.2

  # Файловая система (копирование фото в ApplicationDocuments)
  path_provider: ^2.1.3
  path: ^1.9.0

  # Локальная БД (офлайн-очередь pending_actions)
  sqflite: ^2.3.3

  # Геолокация + фоновый foreground-сервис
  geolocator: ^11.0.0
  flutter_foreground_task: ^8.0.0

  # Запрос разрешений (геолокация, камера и т.д.)
  permission_handler: ^11.3.1

  # Фоновая синхронизация
  workmanager: ^0.5.2

  # Push-уведомления
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.2

  # Звонок по номеру из приложения
  url_launcher: ^6.3.0

  # Кэшированные сетевые изображения (аватары, фото)
  cached_network_image: ^3.4.1

  # Локальные настройки (переключатель push)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Генерация кода
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Иконки приложения
  flutter_launcher_icons: ^0.13.1

# Конфигурация иконок приложения (Android + iOS).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icons/ic_launcher.png"
  # Адаптивная иконка Android: фирменный знак на оранжевом фоне.
  adaptive_icon_background: "#FE4500"
  adaptive_icon_foreground: "icons/ic_launcher_foreground.png"
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/cities/

  # Шрифты подключаются через google_fonts (Montserrat, Bebas Neue).
